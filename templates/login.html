<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #020b18;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Quicksand', sans-serif;
  overflow: hidden;
}

#canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
}

/* ── Carte centrale ── */
.card {
  position: relative;
  z-index: 2;
  width: 360px;
  padding: 44px 36px 36px;
  background: rgba(4, 14, 30, 0.72);
  border: 1px solid rgba(232, 182, 92, 0.14);
  border-radius: 18px;
  backdrop-filter: blur(18px);
  box-shadow: 0 0 60px rgba(10, 20, 50, 0.6), 0 0 0 1px rgba(255,255,255,0.03) inset;
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.9s ease, transform 0.9s ease;
}
.card.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ── Logo ── */
.logo {
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  font-size: 28px;
  letter-spacing: 0.28em;
  color: #f7f1e3;
  text-align: center;
  margin-bottom: 6px;
  text-shadow: 0 0 22px rgba(232,182,92,0.28);
}

.logo-sub {
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(232, 182, 92, 0.45);
  margin-bottom: 36px;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  border-bottom: 1px solid rgba(232,182,92,0.1);
  margin-bottom: 28px;
}

.tab {
  flex: 1;
  padding: 10px 0;
  text-align: center;
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(240,230,210,0.3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.25s, border-color 0.25s;
  margin-bottom: -1px;
}

.tab.active {
  color: #f0ebe0;
  border-bottom-color: rgba(232,182,92,0.6);
}

/* ── Champs ── */
.field {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

.field input {
  width: 100%;
  padding: 13px 16px;
  background: rgba(247,241,227,0.05);
  border: 1px solid rgba(232,182,92,0.15);
  border-radius: 10px;
  color: #f0ebe0;
  font-family: 'Quicksand', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.25s, background 0.25s;
}

.field input::placeholder {
  color: rgba(240,230,210,0.28);
}

.field input:focus {
  border-color: rgba(232,182,92,0.45);
  background: rgba(247,241,227,0.08);
}

/* ── Bouton principal ── */
.btn-main {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(232,182,92,0.22), rgba(138,82,18,0.18));
  border: 1px solid rgba(232,182,92,0.3);
  color: #f3e3c4;
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.25s, box-shadow 0.25s, transform 0.2s;
}

.btn-main:hover {
  background: linear-gradient(135deg, rgba(232,182,92,0.32), rgba(138,82,18,0.28));
  box-shadow: 0 0 20px rgba(232,182,92,0.2);
  transform: translateY(-1px);
}

.btn-main:active {
  transform: translateY(0);
}

/* ── Message d'erreur ── */
.error-msg {
  margin-top: 14px;
  padding: 10px 14px;
  border-radius: 8px;
  background: rgba(180, 60, 60, 0.12);
  border: 1px solid rgba(220, 80, 80, 0.25);
  color: rgba(255, 160, 160, 0.85);
  font-size: 12px;
  text-align: center;
  display: none;
}

.error-msg.visible {
  display: block;
}

/* ── Séparateur ── */
.divider {
  margin: 22px 0 0;
  border: none;
  border-top: 1px solid rgba(232,182,92,0.08);
}

.divider-label {
  text-align: center;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: rgba(240,230,210,0.18);
  margin-top: 16px;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="card" id="card">
  <div class="logo">ZEKWO</div>
  <div class="logo-sub">Cosmic Brainstorming</div>

  <div class="tabs">
    <div class="tab active" id="tabLogin" onclick="switchTab('login')">Sign In</div>
    <div class="tab" id="tabRegister" onclick="switchTab('register')">Sign Up</div>
  </div>

  <!-- Connexion -->
  <div id="formLogin">
    <div class="field">
      <input type="text" id="loginUsername" placeholder="Username" autocomplete="username" />
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" />
    </div>
    <button class="btn-main" onclick="login()">Sign In</button>
    <div class="error-msg" id="loginError"></div>
  </div>

  <!-- Inscription -->
  <div id="formRegister" style="display:none;">
    <div class="field">
      <input type="text" id="regUsername" placeholder="Choisis un nom" autocomplete="username" />
      <input type="password" id="regPassword" placeholder="Mot de passe (4 car. min)" autocomplete="new-password" />
    </div>
    <button class="btn-main" onclick="register()">Sign Up</button>
    <div class="error-msg" id="registerError"></div>
  </div>

  <hr class="divider">
  <div class="divider-label">Sic Itur Ad Astra</div>
</div>

<script>
/* ================= FOND COSMIQUE LÉGER ================= */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

/* -- Étoiles : densité réduite (350 au lieu de 1600) -- */
const STAR_COUNT = 350;
const stars = [];
for (let i = 0; i < STAR_COUNT; i++) {
  stars.push({
    ox: Math.random(), oy: Math.random(),
    r: Math.random() * 1.1 + 0.25,
    a: Math.random() * 0.55 + 0.2,
    t: Math.random() * Math.PI * 2
  });
}

/* -- Petites nébuleuses : 5 au lieu de 16, alpha réduit de moitié -- */
/* La disposition change à chaque chargement car Math.random() n'est pas seedé */
const NEBULA_COUNT = 5;
const nebulae = [];
const nebulaPalette = [
  { r: 190, g: 40,  b: 70  },
  { r: 160, g: 30,  b: 95  },
  { r: 120, g: 35,  b: 160 },
  { r: 95,  g: 35,  b: 135 }
];
for (let i = 0; i < NEBULA_COUNT; i++) {
  const c = nebulaPalette[Math.floor(Math.random() * nebulaPalette.length)];
  nebulae.push({
    ox: Math.random(), oy: Math.random(),
    radius: 60 + Math.random() * 70,
    baseAlpha: 0.03 + Math.random() * 0.055,  /* ~moitié de la v1 */
    color: c,
    t: Math.random() * Math.PI * 2
  });
}

/* -- Grandes nébuleuses : 2 au lieu de 7, alpha réduit -- */
const BIG_NEBULA_COUNT = 2;
const bigNebulae = [];
const bigNebulaPalettes = [
  { inner: '180,235,255', mid: '60,150,215',  outer: '20,55,100' },
  { inner: '255,205,240', mid: '180,70,205',  outer: '60,18,80'  },
  { inner: '215,215,255', mid: '95,95,210',   outer: '28,28,82'  }
];
for (let i = 0; i < BIG_NEBULA_COUNT; i++) {
  const palette = bigNebulaPalettes[i % bigNebulaPalettes.length];
  const radius = 200 + Math.random() * 130;
  const blobCount = 3 + Math.floor(Math.random() * 2);
  const blobs = [];
  for (let b = 0; b < blobCount; b++) {
    const a = Math.random() * Math.PI * 2;
    const distFrac = 0.25 + Math.random() * 0.5;
    blobs.push({ dx: Math.cos(a) * distFrac, dy: Math.sin(a) * distFrac, rFrac: 0.45 + Math.random() * 0.4 });
  }
  bigNebulae.push({
    ox: Math.random(), oy: Math.random(),
    radius, palette, blobs,
    baseAlpha: 0.04 + Math.random() * 0.035,  /* ~moitié de la v1 */
    t: Math.random() * Math.PI * 2
  });
}

function drawNebulae() {
  const cx = canvas.width, cy = canvas.height;
  nebulae.forEach(n => {
    n.t += 0.003;
    const pulse = 0.88 + Math.sin(n.t) * 0.12;
    const alpha = Math.min(1, Math.max(0, n.baseAlpha * pulse));
    if (alpha <= 0.001) return;
    const x = n.ox * cx, y = n.oy * cy;
    const g = ctx.createRadialGradient(x, y, 0, x, y, n.radius);
    g.addColorStop(0, `rgba(${n.color.r},${n.color.g},${n.color.b},${alpha})`);
    g.addColorStop(0.5, `rgba(${n.color.r},${n.color.g},${n.color.b},${alpha * 0.4})`);
    g.addColorStop(1, `rgba(${n.color.r},${n.color.g},${n.color.b},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, n.radius, 0, Math.PI * 2); ctx.fill();
  });
}

function drawBigNebulae() {
  const cx = canvas.width, cy = canvas.height;
  bigNebulae.forEach(n => {
    n.t += 0.002;
    const pulse = 0.92 + Math.sin(n.t) * 0.08;
    const alpha = Math.min(1, Math.max(0, n.baseAlpha * pulse));
    if (alpha <= 0.001) return;
    const pal = n.palette;
    const x = n.ox * cx, y = n.oy * cy;

    const halo = ctx.createRadialGradient(x, y, n.radius * 0.25, x, y, n.radius);
    halo.addColorStop(0, `rgba(${pal.mid},0)`);
    halo.addColorStop(0.7, `rgba(${pal.outer},${alpha * 0.3})`);
    halo.addColorStop(1, `rgba(${pal.outer},0)`);
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(x, y, n.radius, 0, Math.PI * 2); ctx.fill();

    n.blobs.forEach(b => {
      const bx = x + b.dx * n.radius, by = y + b.dy * n.radius;
      const br = n.radius * b.rFrac * 0.5;
      const g = ctx.createRadialGradient(bx, by, 0, bx, by, br);
      g.addColorStop(0, `rgba(${pal.inner},${alpha * 0.04})`);
      g.addColorStop(0.4, `rgba(${pal.inner},${alpha * 0.75})`);
      g.addColorStop(0.7, `rgba(${pal.mid},${alpha * 0.4})`);
      g.addColorStop(1, `rgba(${pal.outer},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
    });
  });
}

let lastTs = null;
function draw(now) {
  if (lastTs === null) lastTs = now;
  lastTs = now;

  const cx = canvas.width, cy = canvas.height;
  ctx.fillStyle = '#020b18';
  ctx.fillRect(0, 0, cx, cy);

  drawBigNebulae();
  drawNebulae();

  stars.forEach(s => {
    s.t += 0.008;
    const alpha = Math.min(1, Math.max(0, s.a + Math.sin(s.t) * 0.15));
    ctx.beginPath();
    ctx.arc(s.ox * cx, s.oy * cy, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(220, 232, 255, ${alpha})`;
    ctx.fill();
  });

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ── Apparition de la carte ── */
setTimeout(() => {
  document.getElementById('card').classList.add('visible');
}, 120);

/* ── Tabs ── */
function switchTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  document.getElementById('formLogin').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('formRegister').style.display = tab === 'register' ? '' : 'none';
  document.getElementById('loginError').classList.remove('visible');
  document.getElementById('registerError').classList.remove('visible');
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('visible');
}

/* ── Login ── */
async function login() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  document.getElementById('loginError').classList.remove('visible');

  const res = await fetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });

  if (res.ok) {
    window.location.href = '/chat';
  } else {
    const data = await res.json();
    showError('loginError', data.erreur || 'Erreur inconnue');
  }
}

/* ── Register ── */
async function register() {
  const username = document.getElementById('regUsername').value.trim();
  const password = document.getElementById('regPassword').value;
  document.getElementById('registerError').classList.remove('visible');

  const res = await fetch('/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });

  if (res.ok) {
    window.location.href = '/chat';
  } else {
    const data = await res.json();
    showError('registerError', data.erreur || 'Erreur inconnue');
  }
}

/* ── Enter pour valider ── */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('formLogin').style.display !== 'none' &&
      document.getElementById('formRegister').style.display === 'none') {
    login();
  } else {
    register();
  }
});
</script>
</body>
</html>
